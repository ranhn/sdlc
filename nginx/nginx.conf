user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 限流
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # 后端上游
    upstream sdlc_backend {
        server sdlc:8000;
        keepalive 32;
    }

    # ========================================
    # HTTP 服务：**全站强制跳 HTTPS**（只留三个白名单走明文）
    #
    # 为什么强制跳：
    #   ① 明文 HTTP 下 JWT、账号密码（登录表单）、导出文件都在网上裸奔；
    #   ② 同一份内容存在两个地址，飞书卡片里的深链、分享链接、Cookie 口径会不一致
    #      （PUBLIC_BASE_URL 配了 https，用户从 http 进来又不一致）。
    #
    # 谁**不**跳（这三条走明文，否则会被自己的跳转坑死）：
    #   · /.well-known/acme-challenge/ —— 证书续期校验必须 HTTP 可达
    #   · /nginx-health —— 容器健康检查走 http://127.0.0.1/nginx-health，
    #     一跳转 healthcheck 就变成"只看 301 不管后端死活"
    #   · /api/health —— update.sh 与外部监控用的接口健康检查，同理必须真打到后端
    #     （否则后端挂了也显示"健康"）
    # ========================================
    server {
        listen 80 default_server;
        server_name _;

        # 白名单①：证书校验路径（Let's Encrypt / 内部 CA 续期都要用）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 白名单②：容器健康检查（docker-compose 的 nginx healthcheck）
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 白名单③：接口健康检查（update.sh / 外部监控）
        location = /api/health {
            access_log off;
            proxy_pass http://sdlc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其余全部跳 HTTPS。
        # 用 $host（不是 $server_name）：内网域名、公网域名、直接输 IP 三种访问都能跳对；
        # $request_uri 带上原始路径与查询串（如 /vulnerabilities/fix?id=12）。
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================
    # HTTPS 服务（生产环境，挂载真实证书到 /etc/nginx/ssl/）
    # 如证书不存在，nginx 会因配置错误启动失败——务必挂载
    # 自签证书由 nginx/Dockerfile 自动生成，浏览器会报警告
    # ========================================
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # API 反代
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://sdlc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 登录限流
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://sdlc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # AI 威胁建模子应用反代（/threat/api/* 走后端 threat_app 子应用）
        location /threat/ {
            proxy_pass http://sdlc_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 前端 SPA
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 静态缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
